<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | My Grocery Buddy</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .input-wrapper {
      position: relative;
    }
    
    .input-wrapper input {
      padding-left: 40px;
    }
    
    .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #666;
      font-size: 16px;
    }
    
    .title-icon {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      color: #4CAF50;
    }
    
    .image-upload-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 1.5rem;
      border: 2px dashed #ddd;
      border-radius: 8px;
      background-color: #f9f9f9;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .image-upload-wrapper:hover {
      border-color: #4CAF50;
      background-color: #f0f8f0;
    }
    
    .image-preview {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      display: none;
      border: 3px solid #4CAF50;
    }
    
    .image-preview.show {
      display: block;
    }
    
    .upload-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      color: #666;
    }
    
    .upload-placeholder i {
      font-size: 3rem;
      color: #4CAF50;
    }
    
    #profileImage {
      display: none;
    }
    
    .file-name {
      font-size: 0.875rem;
      color: #666;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="auth-card">
      <i class="fas fa-shopping-cart title-icon"></i>
      <h1 class="title">My Grocery Buddy</h1>
      <h2>Create Account</h2>

      <form id="registerForm">
        <div class="form-group">
          <label for="profileImage">Profile Picture (Optional)</label>
          <label for="profileImage" class="image-upload-wrapper">
            <img id="imagePreview" class="image-preview" alt="Profile preview">
            <div class="upload-placeholder">
              <i class="fas fa-camera"></i>
              <span>Click to upload photo</span>
              <small>JPG, PNG or GIF (Max 5MB)</small>
            </div>
            <span id="fileName" class="file-name"></span>
          </label>
          <input
            id="profileImage"
            type="file"
            name="profileImage"
            accept="image/jpeg,image/png,image/gif"
          >
        </div>

        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-wrapper">
            <i class="fas fa-user input-icon"></i>
            <input
              id="username"
              type="text"
              name="username"
              required
              minlength="3"
              placeholder="Choose a username"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope input-icon"></i>
            <input
              id="email"
              type="email"
              name="email"
              required
              placeholder="your@email.com"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <i class="fas fa-lock input-icon"></i>
            <input
              id="password"
              type="password"
              name="password"
              required
              minlength="6"
              placeholder="At least 6 characters"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <div class="input-wrapper">
            <i class="fas fa-lock input-icon"></i>
            <input
              id="confirmPassword"
              type="password"
              name="confirmPassword"
              required
              placeholder="Re-enter password"
            >
          </div>
        </div>

        <p id="errorMessage" class="error-message"></p>

        <button class="btn btn-primary" type="submit">
          <i class="fas fa-user-plus"></i> Register
        </button>
      </form>

      <div class="auth-footer">
        <p>
          Already have an account?
          <a href="/login"><i class="fas fa-sign-in-alt"></i> Login here</a>
        </p>
      </div>
    </div>
  </div>

  <script src="/js/register.js"></script>
  <script>
    // Image upload preview functionality
    const profileImageInput = document.getElementById('profileImage');
    const imagePreview = document.getElementById('imagePreview');
    const fileName = document.getElementById('fileName');
    const uploadPlaceholder = document.querySelector('.upload-placeholder');

    profileImageInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      
      if (file) {
        // Check file size (5MB limit)
        if (file.size > 5 * 1024 * 1024) {
          alert('File size must be less than 5MB');
          profileImageInput.value = '';
          return;
        }
        
        // Show preview
        const reader = new FileReader();
        reader.onload = function(e) {
          imagePreview.src = e.target.result;
          imagePreview.classList.add('show');
          uploadPlaceholder.style.display = 'none';
          fileName.textContent = file.name;
        };
        reader.readAsDataURL(file);
      }
    });
  </script>
</body>
</html>
