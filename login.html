<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | My Grocery Buddy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="auth-card">
      <h1 class="title">My Grocery Buddy</h1>
      <h2>Welcome Back</h2>

      <form>
          <div class="mb-3">
            <input type="text" id="disabledTextInput" class="form-control" placeholder="Email">
          </div>
          <div class="mb-3">
            <input type="text" id="disabledTextInput" class="form-control" placeholder="Password">
          </div>
          <div class="mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="disabledFieldsetCheck" disabled>
              <label class="form-check-label" for="disabledFieldsetCheck">
                Can’t check this
              </label>
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Submit</button>
        </fieldset>
      </form>

      <div class="auth-footer">
        <p>
          Don't have an account?
          <a href="/register">Register here</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Login JS -->
  <script src="/js/login.js"></script>
</body>
</html>
