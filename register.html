<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | My Grocery Buddy</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body style="background-color: #f8f9fa">
    <!-- Header -->
    <!-- include ../partials/header -->
    <!-- You can replace the above with your header HTML if needed -->

    <main class="container py-4">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card mt-5 shadow">
            <div class="card-body p-4">
              <h2 class="text-center mb-4">Register</h2>

              <!-- Display error message -->
              <!-- Example: <div class="alert alert-danger">Error message here</div> -->

              <!-- Display success message -->
              <!-- Example: <div class="alert alert-success">Account created!</div> -->

              <form
                action="/auth/register"
                method="POST"
                enctype="multipart/form-data"
              >
                <div class="mb-3">
                  <label for="name" class="form-label">Full Name</label>
                  <input
                    type="text"
                    id="name"
                    name="name"
                    class="form-control"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="email" class="form-label">Email</label>
                  <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="confirmPassword" class="form-label"
                    >Confirm Password</label
                  >
                  <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    class="form-control"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="profileImage" class="form-label"
                    >Profile Image</label
                  >
                  <input
                    type="file"
                    id="profileImage"
                    name="profileImage"
                    class="form-control"
                    accept="image/*"
                  />
                </div>

                <div class="d-grid">
                  <button type="submit" class="btn btn-primary btn-lg">
                    Register
                  </button>
                </div>

                <div class="text-center mt-3">
                  <p>
                    Already have an account?
                    <a href="/login">Login here</a>
                  </p>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="/js/auth.js"></script>
    <script src="/js/grocery.js"></script>
  </body>
</html>
